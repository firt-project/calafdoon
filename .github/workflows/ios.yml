name: iOS App Store

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    env:
      BUNDLE_ID: com.helcalafkaaga.helcalaf
      TEAM_ID: PHULDKCSY6
      VITE_API_URL: https://tel-calafkaaga-1.onrender.com
      VITE_SOCKET_URL: https://tel-calafkaaga-1.onrender.com
      VITE_APP_URL: https://www.helcalafkaaga.com
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_unused

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Write production environment
        working-directory: mobile/apps/client
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_SOCKET_URL=${VITE_SOCKET_URL}
          VITE_APP_URL=${VITE_APP_URL}
          VITE_USE_LOCAL_DEMO=false
          VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
          EOF

      - name: Build web app
        working-directory: mobile
        run: npm run build -w @hel/client

      - name: Sync Capacitor iOS
        working-directory: mobile/apps/client
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: mobile/apps/client/ios/App
        run: pod install

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Check signing configuration
        working-directory: mobile/apps/client/ios/App
        run: |
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" App.xcodeproj/project.pbxproj
          grep -n "DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj

      - name: Build archive
        working-directory: mobile/apps/client/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HelCalaf.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive

      - name: Export IPA
        working-directory: mobile/apps/client/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HelCalaf.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelCalaf-iOS
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
