# CodeQL language/query pack defaults for this monorepo (L3).
# Paths ignored are generated, vendored, or non-app artifacts.

name: Web CodeQL config

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**"
  - "**/coverage/**"
  - "apps/api/public/download/**"
  - "store/**"
  - "docs/**"
