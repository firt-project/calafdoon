# Codemagic CI — builds the HelCalaf Capacitor iOS app on a cloud Mac and
# uploads it to TestFlight / App Store Connect. No local Mac required.
#
# One-time setup in the Codemagic UI (see mobile/store/appstore/APP_STORE_SUBMISSION.md):
#   1. Add this repo to Codemagic.
#   2. Teams → Integrations → App Store Connect: add an API key (Issuer ID, Key ID,
#      .p8). Name the integration exactly:  HelCalaf ASC API key
#   3. Client env vars are hardcoded below (not secret — a public API URL and a
#      Stripe *publishable* key are meant to be public). No UI variable group
#      needed. Update the vars: block directly if the API/website URL changes.
#   4. Register the App ID  com.helcalafkaaga.helcalaf  (Codemagic can auto-create
#      it during "fetch-signing-files --create", or do it in the Apple Developer
#      portal). This matches the existing App Store Connect app record
#      (Apple ID 6811169065) — it intentionally differs from the Android
#      applicationId (com.helcalaf.app), which stays unchanged.

workflows:
  ios-appstore:
    name: HelCalaf iOS — TestFlight / App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: HelCalaf ASC API key
    environment:
      vars:
        BUNDLE_ID: "com.helcalafkaaga.helcalaf"
        XCODE_PROJECT_DIR: "mobile/apps/client/ios/App"
        XCODE_SCHEME: "App"
        VITE_API_URL: "https://tel-calafkaaga-1.onrender.com"
        VITE_SOCKET_URL: "https://tel-calafkaaga-1.onrender.com"
        VITE_APP_URL: "https://www.helcalafkaaga.com"
        VITE_STRIPE_PUBLISHABLE_KEY: "pk_test_unused"
      node: 22
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/mobile/node_modules
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/mobile/apps/client/ios/App/Pods
    scripts:
      - name: Install JS dependencies (workspace root)
        script: |
          cd mobile
          npm ci

      - name: Write client production env
        script: |
          cd mobile/apps/client
          cat > .env.production <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_SOCKET_URL=${VITE_SOCKET_URL:-$VITE_API_URL}
          VITE_APP_URL=${VITE_APP_URL:-$VITE_API_URL}
          VITE_USE_LOCAL_DEMO=false
          VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_unused}
          EOF
          echo "wrote apps/client/.env.production:"
          sed 's/=.*/=<set>/' .env.production

      - name: Build web assets (@hel/client)
        script: |
          cd mobile
          npm run build -w @hel/client

      - name: Capacitor sync iOS
        script: |
          cd mobile/apps/client
          npx cap sync ios

      - name: CocoaPods install
        script: |
          cd "$XCODE_PROJECT_DIR"
          pod install

      - name: Set build number (Codemagic auto-increments)
        script: |
          cd "$XCODE_PROJECT_DIR"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Fetch signing files (auto-creates profile + App ID)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build .ipa
        script: |
          cd "$XCODE_PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/**/*.dSYM
    publishing:
      # Codemagic emails the committer by default. Add explicit recipients in the
      # Codemagic UI or here if you want more.
      app_store_connect:
        auth: integration
        # Uploads the build to TestFlight. The FIRST public App Store release must
        # still be submitted by hand in App Store Connect (metadata + screenshots +
        # age rating + review). After that first release you can flip
        # submit_to_app_store: true for hands-off releases.
        submit_to_testflight: true
        # submit_to_app_store: true
        # release_type: MANUAL
