# Production stack template — DOCUMENTATION + deploy scaffolding.
# Do NOT copy staging credentials. Do NOT point staging at these volumes.
#
# Prerequisites: TLS DNS, managed Postgres/Redis preferred; this compose is for
# single-VPS self-host. Prefer managed DB + Redis in real production.
#
# Usage (production host only):
#   cp .env.production.example .env.production   # fill in secret store, never commit
#   docker compose -f infra/production/docker-compose.production.yml --env-file .env.production up -d
#
# API starts with `prisma migrate deploy` via Dockerfile CMD.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
      POSTGRES_DB: ${POSTGRES_DB:-hel_calafkaaga}
    volumes:
      - hel_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [production]
    # Do not publish 5432 publicly

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - hel_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [production]

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?set}
      REDIS_URL: ${REDIS_URL:?set}
      SESSION_SECRET: ${SESSION_SECRET:?set}
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.helcalafkaaga.com}
      CORS_ORIGINS: ${CORS_ORIGINS:?set}
      APP_URL: ${APP_URL:?set}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: ${S3_ENDPOINT:?set}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_BUCKET_PROFILE: ${S3_BUCKET_PROFILE:-hel-profile}
      S3_BUCKET_PROFILE_PRIVATE: ${S3_BUCKET_PROFILE_PRIVATE:-hel-profile-private}
      S3_BUCKET_CHAT: ${S3_BUCKET_CHAT:-hel-chat}
      S3_BUCKET_SUPPORT: ${S3_BUCKET_SUPPORT:-hel-support}
      S3_BUCKET_EVC: ${S3_BUCKET_EVC:-hel-evc}
      MAIL_DRIVER: ${MAIL_DRIVER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      STRIPE_GATEWAY: live
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set}
      STRIPE_ALLOW_LIVE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    networks: [production]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - hel_prod_caddy:/data
      - hel_prod_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [production]

networks:
  production:
    driver: bridge

volumes:
  hel_prod_pg:
  hel_prod_redis:
  hel_prod_caddy:
  hel_prod_caddy_config:
