<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="HelCalaf — halal marriage matchmaking on mobile."
    />
    <meta name="theme-color" content="#a61b2b" />
    <meta name="color-scheme" content="light" />
    <title>HelCalaf</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #a61b2b;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      #boot-fail {
        display: none;
        padding: 2rem 1.25rem;
        max-width: 28rem;
        margin: 0 auto;
      }
      #boot-fail h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      #boot-fail p {
        opacity: 0.9;
        line-height: 1.45;
      }
      #boot-fail code {
        display: block;
        margin-top: 1rem;
        padding: 0.75rem;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 0.5rem;
        font-size: 0.75rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fail" role="alert">
      <h1>HelCalaf could not start</h1>
      <p>
        The app shell loaded, but the JavaScript bundle failed. Reinstall the
        latest APK (v1.0.1+) from your laptop.
      </p>
      <code id="boot-fail-detail"></code>
    </div>
    <script>
      window.addEventListener("error", function (ev) {
        var el = document.getElementById("boot-fail");
        var detail = document.getElementById("boot-fail-detail");
        if (!el || !detail) return;
        if (document.getElementById("root")?.childElementCount) return;
        el.style.display = "block";
        detail.textContent =
          (ev && ev.message ? ev.message : "Unknown error") +
          (ev && ev.filename ? "\n" + ev.filename : "");
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var el = document.getElementById("boot-fail");
        var detail = document.getElementById("boot-fail-detail");
        if (!el || !detail) return;
        if (document.getElementById("root")?.childElementCount) return;
        el.style.display = "block";
        detail.textContent = String(
          (ev && ev.reason && (ev.reason.message || ev.reason)) ||
            "Unhandled promise rejection"
        );
      });
      // If the module never executes, surface a hint after a few seconds.
      setTimeout(function () {
        var root = document.getElementById("root");
        var el = document.getElementById("boot-fail");
        var detail = document.getElementById("boot-fail-detail");
        if (!root || !el || root.childElementCount > 0) return;
        el.style.display = "block";
        if (detail && !detail.textContent) {
          detail.textContent =
            "Timed out waiting for app JS. Often caused by absolute /assets paths in Capacitor.";
        }
      }, 8000);
    </script>
    <!-- Google fonts are optional; do not block first paint on native. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
